<!DOCTYPE html>
<html lang="en" data-theme="tokyo-night">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Collin Doyle — collin.rocks</title>
  <meta name="description" content="Collin Doyle — Systems Administrator & Team Lead. IT infrastructure, cloud, security, automation, and a homelab that won't quit." />
  <meta name="color-scheme" content="dark" />

  <!-- Open Graph / social -->
  <meta property="og:title" content="Collin Doyle — collin.rocks" />
  <meta property="og:description" content="Systems Administrator & Team Lead. Infrastructure, automation, local AI, and a homelab." />
  <meta property="og:type" content="website" />
  <meta property="og:url" content="https://collin.rocks" />

  <link rel="icon" href="assets/favicon.svg" type="image/svg+xml" />

  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link
    rel="preload"
    as="style"
    href="https://fonts.googleapis.com/css2?family=JetBrains+Mono:wght@400;500;700&display=swap&subset=latin"
  />
  <link
    rel="stylesheet"
    href="https://fonts.googleapis.com/css2?family=JetBrains+Mono:wght@400;500;700&display=swap&subset=latin"
  />

  <link rel="stylesheet" href="css/styles.css" />
</head>
<body>
  <header class="statusbar" role="banner">
    <div class="statusbar__left">
      <span class="statusbar__handle">collin@rocks</span>
    </div>

    <div class="statusbar__right">
      <button
        id="theme-toggle"
        class="statusbar__btn"
        type="button"
        aria-label="Change theme"
        title="Change theme (cycle)"
      >
        <span aria-hidden="true">◐</span> <span id="theme-name">tokyo-night</span>
      </button>
      <time id="clock" class="statusbar__clock" aria-label="Current time">--:--</time>
    </div>
  </header>

  <main id="desktop" class="desktop" aria-label="Desktop">

    <noscript>
      <div class="noscript">
        <h1>Collin Doyle</h1>
        <p><strong>Systems Administrator &amp; Team Lead</strong> — Fort Myers, Florida</p>
        <p>
          Systems &amp; network administrator with over a decade of experience
          leading IT operations and building secure, scalable infrastructure.
          Microsoft 365 / Entra ID / Intune, networking, AWS, automation, local
          AI, and a homelab that won't quit.
        </p>
        <h2>Links</h2>
        <ul>
          <li><a href="https://github.com/CollinJDoyle">GitHub</a></li>
          <li><a href="mailto:cj.doyle@outlook.com">cj.doyle@outlook.com</a></li>
          <li><a href="https://www.linkedin.com/in/collinjdoyle/">LinkedIn</a></li>
          <li><a href="assets/resume.pdf">Download résumé (PDF)</a></li>
        </ul>
        <h2>Projects</h2>
        <ul>
          <li><strong>Unraid home server</strong> — Dockerized app stack, Postgres, full media stack.</li>
          <li><strong>Local Kubernetes cluster</strong> — self-managed homelab k8s for containerized workloads.</li>
        </ul>
        <p><em>This is the no-JavaScript view. Enable JavaScript for the full interactive desktop.</em></p>
      </div>
    </noscript>
  </main>

  <nav class="dock" aria-label="Open windows">
    <button class="dock__btn" type="button" data-launch="about"    title="about">about</button>
    <button class="dock__btn" type="button" data-launch="projects" title="projects">projects</button>
    <button class="dock__btn" type="button" data-launch="resume"   title="resume">resume</button>
    <button class="dock__btn" type="button" data-launch="blog"     title="blog">blog</button>
    <button class="dock__btn" type="button" data-launch="contact"  title="contact">contact</button>
    <button class="dock__btn dock__btn--accent" type="button" data-launch="terminal" title="terminal">&gt;_</button>
  </nav>

  <script src="js/data.js" defer></script>
  <script src="js/windows.js" defer></script>
  <script src="js/terminal.js" defer></script>
  <script src="js/main.js" defer></script>
</body>
</html>
